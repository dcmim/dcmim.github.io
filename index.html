<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dcmim // GitHub Portfolio</title>
  <meta name="description" content="Developer portfolio and repository explorer for github.com/dcmim." />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
    }
    @keyframes google-bar {
      0% { transform: translateX(-100%); width: 30%; }
      50% { transform: translateX(50%); width: 60%; }
      100% { transform: translateX(200%); width: 30%; }
    }
    .animate-google-bar {
      animation: google-bar 1.5s infinite ease-in-out;
    }
    @keyframes stretch-y {
      0%, 100% { transform: scaleY(1) scaleX(1); }
      50% { transform: scaleY(2.2) scaleX(0.6); }
    }
    .dot-1 { animation: stretch-y 0.8s infinite ease-in-out 0s; transform-origin: bottom; }
    .dot-2 { animation: stretch-y 0.8s infinite ease-in-out 0.2s; transform-origin: bottom; }
    .dot-3 { animation: stretch-y 0.8s infinite ease-in-out 0.4s; transform-origin: bottom; }
  </style>
</head>
<body class="bg-white text-black min-h-screen flex flex-col selection:bg-emerald-200 selection:text-black">

  <!-- Project Loading Screen Overlay (Appears on /repo /project route) -->
  <div id="project-loading-screen" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-500 hidden">
    <!-- Top Google Progress Bar -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-blue-100 overflow-hidden">
      <div class="h-full bg-blue-600 animate-google-bar"></div>
    </div>

    <div class="flex flex-col items-center gap-6">
      <div id="loading-project-text" class="text-xs font-bold uppercase tracking-widest text-slate-700">Loading project...</div>
      <!-- Three Gray Y-Stretching Dots -->
      <div class="flex items-center gap-3 h-10">
        <div class="w-3.5 h-7 bg-gray-400 rounded-full dot-1"></div>
        <div class="w-3.5 h-7 bg-gray-400 rounded-full dot-2"></div>
        <div class="w-3.5 h-7 bg-gray-400 rounded-full dot-3"></div>
      </div>
    </div>
  </div>

  <!-- Dynamic Router Container -->
  <div id="router-container" class="flex-1 flex flex-col">
    <!-- Default Portfolio View -->
    <div id="main-view" class="flex-1 flex flex-col">
      <!-- Header -->
      <header class="border-b border-emerald-200/80 bg-emerald-50/60 px-4 sm:px-6 py-4 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="w-3 h-3 bg-emerald-500 rounded-full"></span>
            <span class="text-xs sm:text-sm font-bold tracking-tight">dcmim.dev</span>
          </div>
          <div class="flex items-center gap-3 text-xs font-medium">
            <a href="https://github.com/dcmim" target="_blank" class="px-3.5 py-2 bg-white border border-emerald-200 hover:bg-emerald-50 rounded-xl transition-colors shadow-xs">GitHub</a>
            <button onclick="scrollToSearch()" class="px-3.5 py-2 bg-emerald-600 text-white hover:bg-emerald-500 rounded-xl transition-colors shadow-xs">Explore</button>
          </div>
        </div>
      </header>

      <!-- Main Container -->
      <main class="max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-1 flex flex-col gap-10">
        
        <!-- Profile Card -->
        <section class="border border-emerald-200/80 bg-emerald-50/40 p-6 sm:p-8 rounded-3xl flex flex-col sm:flex-row gap-6 items-center sm:items-start text-center sm:text-left shadow-sm">
          <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop" alt="avatar" class="w-24 h-24 rounded-2xl object-cover bg-white p-1.5 shadow-sm shrink-0 border border-emerald-200">
          <div class="flex flex-col gap-2.5 flex-1">
            <h1 id="user-name" class="text-xl sm:text-2xl font-bold text-black tracking-tight">dcmim</h1>
            <p id="user-bio" class="text-xs sm:text-sm text-slate-700 leading-relaxed">Loading bio...</p>
            <div class="flex flex-wrap items-center justify-center sm:justify-start gap-4 text-xs text-emerald-900 pt-1 font-medium">
              <span class="px-3 py-1 bg-emerald-100/70 rounded-full">Repos: <strong id="stat-repos" class="text-black">0</strong></span>
              <span class="px-3 py-1 bg-emerald-100/70 rounded-full">Followers: <strong id="stat-followers" class="text-black">0</strong></span>
            </div>
            <p class="text-[11px] text-emerald-800 pt-2 font-mono">Tip: Type <code class="bg-emerald-100 px-1.5 py-0.5 rounded text-black font-bold">/#project-name</code> in the URL to inspect or launch projects.</p>
          </div>
        </section>

        <!-- Repositories Section -->
        <section id="repos-section" class="flex flex-col gap-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-emerald-200/80 pb-3">
            <h2 class="text-xs sm:text-sm font-bold uppercase tracking-wider text-black">Repositories</h2>
            <div class="flex items-center gap-2 text-xs">
              <input 
                type="text" 
                id="search-input" 
                placeholder="Search repos..." 
                oninput="filterRepos()"
                class="w-full sm:w-56 px-4 py-2.5 bg-emerald-50/30 border border-emerald-200 rounded-2xl text-black text-xs focus:outline-none focus:border-emerald-500 shadow-xs"
              >
            </div>
          </div>

          <!-- Repo Grid -->
          <div id="repo-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div class="border border-emerald-200/80 p-8 text-xs text-slate-500 bg-emerald-50/20 rounded-3xl col-span-full text-center">
              Loading repositories from GitHub...
            </div>
          </div>
        </section>

      </main>

      <!-- Footer -->
      <footer class="border-t border-emerald-200/80 bg-emerald-50/40 px-6 py-6 mt-12 text-center text-xs text-slate-600">
        <p>© dcmim.dev · Pure Static GitHub Pages Edition</p>
      </footer>
    </div>

    <!-- Project Inspector / Webpage View (Loaded via Hash Route /#[project-name]) -->
    <div id="project-view" class="hidden flex-1 flex flex-col"></div>
  </div>

  <script>
    let allRepos = [];

    async function init() {
      window.addEventListener('hashchange', handleRouter);
      
      try {
        const [userRes, reposRes] = await Promise.all([
          fetch('https://api.github.com/users/dcmim'),
          fetch('https://api.github.com/users/dcmim/repos?per_page=100&sort=updated')
        ]);

        const userData = await userRes.json();
        const reposData = await reposRes.json();
        allRepos = Array.isArray(reposData) ? reposData : [];

        document.getElementById('user-name').innerText = userData.name || userData.login || 'dcmim';
        document.getElementById('user-bio').innerText = userData.bio || 'Software Engineer & Creator.';
        document.getElementById('user-avatar').src = userData.avatar_url || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop';
        document.getElementById('stat-repos').innerText = userData.public_repos ?? allRepos.length;
        document.getElementById('stat-followers').innerText = userData.followers || 0;

        renderRepos(allRepos);
      } catch (err) {
        console.error(err);
        renderRepos([]);
      }

      handleRouter();
    }

    async function handleRouter() {
      const hash = window.location.hash.slice(1); // e.g. /project-name or project-name
      const mainView = document.getElementById('main-view');
      const projectView = document.getElementById('project-view');
      const loadingScreen = document.getElementById('project-loading-screen');

      if (!hash) {
        loadingScreen.classList.add('hidden');
        mainView.classList.remove('hidden');
        projectView.classList.add('hidden');
        projectView.innerHTML = '';
        return;
      }

      const projectName = hash.startsWith('/') ? hash.slice(1) : hash;
      
      // Show loading screen on /repo with 3 seconds minimum loading time
      const startTime = Date.now();
      document.getElementById('loading-project-text').innerText = `Loading project /${projectName}...`;
      loadingScreen.classList.remove('hidden');
      loadingScreen.style.opacity = '1';

      mainView.classList.add('hidden');
      projectView.classList.remove('hidden');

      try {
        const repo = allRepos.find(r => r.name.toLowerCase() === projectName.toLowerCase());
        
        // Ensure minimum 3 seconds loading time as requested
        const elapsed = Date.now() - startTime;
        const minLoadingTime = 3000;
        const remainingTime = Math.max(0, minLoadingTime - elapsed);

        await new Promise(resolve => setTimeout(resolve, remainingTime));

        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.classList.add('hidden'), 500);

        if (!repo) {
          throw new Error(`${projectName} doesn't exist in my project`);
        }

        const lang = (repo.language || '').toLowerCase();
        const description = (repo.description || '').toLowerCase();
        const isWeb = lang.includes('html') || lang.includes('javascript') || lang.includes('css') || description.includes('web') || description.includes('site');

        let files = [];
        if (isWeb) {
          files = [
            { name: 'index.html', type: 'file', content: `<!DOCTYPE html>\n<html>\n<head>\n  <title>${repo.name}</title>\n  <style>body { font-family: monospace; padding: 40px; background: #fff; color: #000; }</style>\n</head>\n<body>\n  <h1>${repo.name}</h1>\n  <p>${repo.description || 'Web project preview'}</p>\n  <script>console.log("Loaded ${repo.name}");<\/script>\n</body>\n</html>` }
          ];
        } else {
          files = [
            { name: 'README.md', type: 'file', content: `# ${repo.name}\n\n${repo.description}\n\n## Overview\nRepository by dcmim.` },
            { name: 'package.json', type: 'file', content: `{\n  "name": "${repo.name}",\n  "version": "1.0.0"\n}` },
            { name: 'index.js', type: 'file', content: `// ${repo.name}\nconsole.log("${repo.name} initialized.");` }
          ];
        }

        const repoData = {
          name: repo.name,
          fullName: repo.full_name,
          description: repo.description,
          htmlUrl: repo.html_url,
          isWebProject: isWeb,
          files
        };

        // RULE 2: If detected HTML, js, CSS (web project) -> show webpage itself NO UI no file list!
        if (repoData.isWebProject) {
          const htmlFile = repoData.files.find(f => f.name.endsWith('.html')) || repoData.files[0];
          const content = htmlFile ? htmlFile.content : '<h1>No HTML content found</h1>';
          
          projectView.innerHTML = `<iframe id="web-preview-frame" class="w-full flex-1 border-none min-h-screen"></iframe>`;
          document.getElementById('web-preview-frame').srcdoc = content;
          return;
        }

        // RULE 1: If non-HTML project -> shows File List where you can see code, download button, folders, and files
        renderFileListView(repoData);

      } catch (err) {
        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.classList.add('hidden'), 500);

        projectView.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center p-8 text-center gap-6">
            <div class="text-xl font-bold text-black">${projectName} doesn't exist in my project</div>
            <a href="#" onclick="window.location.hash=''; return false;" class="px-5 py-2.5 bg-emerald-600 text-white rounded-2xl text-xs font-bold hover:bg-emerald-500 transition-colors shadow-xs">← Back to Portfolio</a>
          </div>
        `;
      }
    }

    let currentRepoData = null;
    let selectedFileContent = '';

    function renderFileListView(repoData) {
      currentRepoData = repoData;
      const firstFile = repoData.files.find(f => f.type === 'file') || { name: 'README.md', content: repoData.description };
      selectedFileContent = firstFile.content || '';

      const projectView = document.getElementById('project-view');
      projectView.innerHTML = `
        <header class="border-b border-emerald-200/80 bg-emerald-50/60 px-4 sm:px-6 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <a href="#" onclick="window.location.hash=''; return false;" class="text-xs font-bold text-emerald-800 hover:underline">← Portfolio</a>
            <span class="text-slate-300">/</span>
            <span class="text-xs font-bold text-black">${repoData.name}</span>
          </div>
          <div class="flex items-center gap-3">
            <button onclick="downloadProjectZip()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-500 transition-colors shadow-xs">
              Download Project
            </button>
            <a href="${repoData.htmlUrl}" target="_blank" class="px-4 py-2 bg-white border border-emerald-200 rounded-xl text-xs font-bold hover:bg-emerald-50 transition-colors">
              GitHub
            </a>
          </div>
        </header>

        <div class="flex-1 grid grid-cols-1 md:grid-cols-12 bg-white">
          <!-- File Tree Sidebar -->
          <div class="md:col-span-4 border-r border-emerald-200/80 bg-emerald-50/30 p-4 sm:p-6 flex flex-col gap-3">
            <div class="text-xs font-bold uppercase tracking-wider text-black pb-2 border-b border-emerald-200">Files & Folders</div>
            <div class="flex flex-col gap-1 text-xs" id="file-tree-list">
              ${renderTree(repoData.files)}
            </div>
          </div>

          <!-- Code Viewer -->
          <div class="md:col-span-8 flex flex-col bg-slate-950 text-emerald-300 p-6 overflow-x-auto">
            <div class="text-xs text-slate-500 pb-2 border-b border-slate-800 font-mono mb-4" id="active-filename">${firstFile.name}</div>
            <pre class="font-mono text-xs leading-relaxed text-emerald-300 whitespace-pre-wrap" id="code-viewer-pre">${escapeHtml(selectedFileContent)}</pre>
          </div>
        </div>
      `;
    }

    function renderTree(files) {
      return (files || []).map(f => {
        if (f.type === 'folder') {
          return `
            <div class="flex flex-col gap-1 py-1">
              <span class="text-slate-700 font-bold flex items-center gap-1.5">📁 ${f.name}/</span>
              <div class="pl-4 border-l border-emerald-200 ml-1">
                ${renderTree(f.children || [])}
              </div>
            </div>
          `;
        } else {
          return `
            <button onclick="selectFile('${encodeURIComponent(f.name)}', '${encodeURIComponent(f.content || '')}')" class="text-left py-1.5 px-2 rounded-xl hover:bg-emerald-100/60 text-slate-800 flex items-center gap-1.5 transition-colors">
              📄 ${f.name}
            </button>
          `;
        }
      }).join('');
    }

    function selectFile(nameEnc, contentEnc) {
      const name = decodeURIComponent(nameEnc);
      const content = decodeURIComponent(contentEnc);
      document.getElementById('active-filename').innerText = name;
      document.getElementById('code-viewer-pre').innerText = content;
    }

    function downloadProjectZip() {
      if (!currentRepoData) return;
      const textContent = (currentRepoData.files || []).map(f => `--- ${f.name} ---\n${f.content || ''}`).join('\n\n');
      const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentRepoData.name}-source.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderRepos(repos) {
      const grid = document.getElementById('repo-grid');
      if (!repos || repos.length === 0) {
        grid.innerHTML = '<div class="border border-emerald-200/80 p-10 text-xs text-slate-600 bg-emerald-50/20 rounded-3xl col-span-full text-center font-medium">There\'s no repos</div>';
        return;
      }

      grid.innerHTML = repos.map(repo => `
        <div onclick="window.location.hash='/${repo.name}'" class="border border-emerald-200/80 hover:border-emerald-400 bg-emerald-50/30 hover:bg-emerald-50/90 p-5 sm:p-6 rounded-3xl flex flex-col justify-between gap-4 cursor-pointer transition-all shadow-xs group">
          <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs sm:text-sm font-bold text-black truncate group-hover:text-emerald-900">/${repo.name}</span>
              <span class="text-[10px] text-emerald-800 bg-emerald-100/80 px-2 py-0.5 rounded-full shrink-0">${repo.language || 'Code'}</span>
            </div>
            <p class="text-xs text-slate-700 line-clamp-2 leading-relaxed">${repo.description || 'No description.'}</p>
          </div>
          <div class="flex items-center justify-between pt-3 border-t border-emerald-200/80 text-[11px] text-slate-600">
            <span>⭐ ${repo.stargazers_count || 0}</span>
            <span class="text-emerald-800 font-bold">&gt; Open</span>
          </div>
        </div>
      `).join('');
    }

    function filterRepos() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allRepos.filter(repo => 
        repo.name.toLowerCase().includes(query) || 
        (repo.description && repo.description.toLowerCase().includes(query))
      );
      renderRepos(filtered);
    }

    function scrollToSearch() {
      document.getElementById('repos-section').scrollIntoView({ behavior: 'smooth' });
    }

    window.onload = init;
  </script>
</body>
</html>
